name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails if bun.lock is out of date rather than
      # silently resolving something different from what was committed.
      - name: Install
        run: bun install --frozen-lockfile

      # Covers src/ and convex/. Convex codegen output is committed, so this
      # needs no deployment and no secrets.
      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bunx vite build

# `bun run check`, `bun run smoke` and `bun run measure` are deliberately not
# wired in here: all three need a running Convex backend, a seeded
# organisation, and sign-in credentials. They are the gates that catch the
# failures this project has actually had — the balance invariant, the
# collection-mode rule, and the payload growing with history — so run them
# against a local deployment after `bun run seed:history`:
#
#   bun run seed:history && bun run check && bun run smoke && bun run measure
#
# Wiring them into CI needs a hosted Convex deployment with credentials
# injected as secrets; tracked in docs/ROADMAP.md -> M8.
