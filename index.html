<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommunityFund — Fund Management</title>
    <meta
      name="description"
      content="Track funds, collect monthly member contributions, and reconcile every rupee against the bank."
    />
    <!--
      The member portal is installable. The manifest is a static file in public/
      rather than something injected, because a manifest that only exists after
      JavaScript runs cannot be used to decide whether to show an install prompt.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <meta name="theme-color" content="#0f0e1c" />
    <!-- iOS ignores the manifest for home-screen icons, so it is told directly. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CommunityFund" />
    <!-- Fonts recovered from the original build -->
    <link
      rel="preconnect"
      href="https://api.fontshare.com"
      crossorigin
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("cf-theme") === "dark") {
          document.documentElement.classList.add("dark")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
